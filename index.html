<!DOCTYPE html><html lang='vi'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#2563eb'><link rel='manifest' href='manifest.json'><title>Parking Tracker V3 PWA</title><style>:root{--b:#2563eb;--g:#16a34a;--d:#64748b}body{font-family:system-ui;margin:0;background:#f3f4f6;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}button{border:0;border-radius:12px;padding:12px;color:#fff;font-weight:700;margin:4px}.g{background:var(--g)}.b{background:var(--b)}.d{background:var(--d)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cell{background:#fff;border-radius:10px;padding:8px;min-height:56px;border:1px solid #ddd}.t10{background:#dcfce7}.t12{background:#dbeafe}.off{background:#e5e7eb}</style></head><body><div class='card'><h2>🚲 Parking Tracker V3</h2><button class='g' onclick='quick(10000)'>Hôm nay 10k</button><button class='b' onclick='quick(12000)'>Hôm nay 12k</button><button class='d' onclick='quick(0)'>Hôm nay nghỉ</button><p id='sum'></p></div><div class='card'><div id='cal' class='grid'></div></div><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');const t=new Date();const k=()=>`p_${t.getFullYear()}_${t.getMonth()}`;const load=()=>JSON.parse(localStorage.getItem(k())||'{}');const save=x=>localStorage.setItem(k(),JSON.stringify(x));function quick(v){let d=load();d[t.getDate()]=v;save(d);render()}function render(){const d=load();let c=document.getElementById('cal');c.innerHTML='';let days=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();let c10=0,c12=0,o=0;for(let i=1;i<=days;i++){let v=d[i];let cls='cell';if(v===10000){cls+=' t10';c10++}else if(v===12000){cls+=' t12';c12++}else if(v===0){cls+=' off';o++}let e=document.createElement('div');e.className=cls;e.textContent=i;e.onclick=()=>{let n=prompt('10,12,0',v===undefined?'':v/1000);if(n==='10')d[i]=10000;else if(n==='12')d[i]=12000;else if(n==='0')d[i]=0;save(d);render()};c.appendChild(e)}document.getElementById('sum').innerText=`Tổng: ${(c10*10000+c12*12000).toLocaleString('vi-VN')}đ | 10k:${c10} | 12k:${c12} | Nghỉ:${o}`;}render();</script></body></html>
